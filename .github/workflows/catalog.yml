# Every hour: colour-tag new catalogue products, and post due Instagram posts (docs/marketing/AUTOPOST.md).
# Needs two repository secrets: SITE_URL (https://www.kulort-nyanse.com) and CRON_SECRET (same as in Vercel).
# Without them the job skips quietly.
name: catalog
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tag product colours
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "secrets not set, skipping"; exit 0; fi
          for i in 1 2 3 4; do
            out=$(curl -sS -m 70 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/catalog?step=tag")
            echo "$out"
            echo "$out" | grep -q '"left":true' || break
          done
      - name: Post due Instagram posts
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "secrets not set, skipping"; exit 0; fi
          curl -sS -m 70 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/social"
